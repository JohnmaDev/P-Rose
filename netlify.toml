[build]
  base = "."
  command = "cd front-nuxt && npm install && npm run generate"
  publish = "front-nuxt/dist"
  functions = "backend/functions"

[build.environment]
  GO_VERSION = "1.21"
  NODE_VERSION = "20"
  AWS_LAMBDA_JS_RUNTIME = "nodejs20.x"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev --prefix front-nuxt"
  port = 8888
  targetPort = 3000
  publish = "front-nuxt/dist"


